<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheryl's Recipe Box - Test Console</title>
  <style>
    body {
      font-family: monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #4ec9b0;
    }
    .section {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .error {
      color: #f48771;
      background: #3f2f2f;
      border-left: 3px solid #f48771;
      padding: 8px;
      margin: 8px 0;
      border-radius: 2px;
    }
    .success {
      color: #89d185;
      background: #2f3f2f;
      border-left: 3px solid #89d185;
      padding: 8px;
      margin: 8px 0;
      border-radius: 2px;
    }
    .warning {
      color: #dcdcaa;
      background: #3f3f2f;
      border-left: 3px solid #dcdcaa;
      padding: 8px;
      margin: 8px 0;
      border-radius: 2px;
    }
    .code {
      background: #1e1e1e;
      border: 1px solid #3e3e42;
      border-radius: 2px;
      padding: 8px;
      margin: 4px 0;
      overflow-x: auto;
    }
    button {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      margin-right: 8px;
    }
    button:hover {
      background: #1177bb;
    }
    .test-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .test-item {
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
    }
    .test-item.pass {
      background: #2f3f2f;
      border-color: #89d185;
      color: #89d185;
    }
    .test-item.fail {
      background: #3f2f2f;
      border-color: #f48771;
      color: #f48771;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Cheryl's Recipe Box - Test Console</h1>
    
    <div class="section">
      <h2>Test Controls</h2>
      <button onclick="runTests()">Run All Tests</button>
      <button onclick="loadApp()">Load Full App</button>
      <button onclick="openApp()">Open App in New Tab</button>
    </div>

    <div class="section">
      <h2>Browser Console</h2>
      <p>Open browser DevTools (F12) to see live console output</p>
      <button onclick="testConsoleLogging()">Test Console Logging</button>
      <div id="consoleOutput"></div>
    </div>

    <div class="section">
      <h2>Module Dependency Check</h2>
      <div id="dependencyCheck"></div>
    </div>

    <div class="section">
      <h2>Global Variables Check</h2>
      <div id="globalsCheck"></div>
    </div>

    <div class="section">
      <h2>Test Results</h2>
      <div id="testResults"></div>
    </div>

    <div class="section">
      <h2>HTML Structure</h2>
      <button onclick="checkHtmlStructure()">Check HTML Structure</button>
      <div id="htmlCheck"></div>
    </div>
  </div>

  <script>
    let testLog = [];

    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      console.log(`[${timestamp}] ${message}`);
      testLog.push({ message, type, timestamp });
    }

    function testConsoleLogging() {
      log('✓ Console logging is working', 'success');
      log('Test warning', 'warning');
      log('Test error message', 'error');
      updateConsoleOutput();
    }

    function updateConsoleOutput() {
      const output = document.getElementById('consoleOutput');
      output.innerHTML = testLog.map(entry => {
        const icon = entry.type === 'success' ? '✓' : entry.type === 'error' ? '✗' : 'ℹ';
        return `<div class="${entry.type}">${entry.timestamp} | ${icon} ${entry.message}</div>`;
      }).join('');
      output.scrollTop = output.scrollHeight;
    }

    async function runTests() {
      testLog = [];
      log('Starting test suite...', 'info');

      checkModuleDependencies();
      checkGlobalVariables();
      await checkSupabaseConnection();
      checkHtmlStructure();
      
      log('Test suite completed', 'success');
      updateConsoleOutput();
    }

    function checkModuleDependencies() {
      log('Checking module dependencies...', 'info');

      const deps = [
        { name: 'config.js', vars: ['SUPABASE_CONFIG', 'APP_PIN', 'MAIN_CATEGORIES'] },
        { name: 'db.js', funcs: ['initializeSupabase', 'fetchAllRecipes', 'saveNewRecipe'] },
        { name: 'images.js', funcs: ['getRecipeImages', 'compressImageFile', 'uploadSelectedImages'] },
        { name: 'ui.js', funcs: ['initializeUI', 'hideAllPanels', 'renderRecipes'] },
        { name: 'auth.js', funcs: ['initializeAuth', 'unlockSite', 'isUserAuthenticated'] },
        { name: 'ocr.js', funcs: ['performOCR', 'createDraftFromOCR', 'submitOCRRecipe'] },
        { name: 'app.js', funcs: ['initializeApp', 'setupEventListeners', 'loadRecipes'] }
      ];

      const results = document.getElementById('dependencyCheck');
      results.innerHTML = '';

      deps.forEach(dep => {
        const item = document.createElement('div');
        let allFound = true;

        if (dep.vars) {
          dep.vars.forEach(v => {
            if (typeof window[v] === 'undefined') {
              allFound = false;
            }
          });
        }

        if (dep.funcs) {
          dep.funcs.forEach(f => {
            if (typeof window[f] !== 'function') {
              allFound = false;
            }
          });
        }

        item.className = `test-item ${allFound ? 'pass' : 'fail'}`;
        item.textContent = `${allFound ? '✓' : '✗'} ${dep.name}`;
        results.appendChild(item);

        if (allFound) {
          log(`✓ ${dep.name} loaded correctly`, 'success');
        } else {
          log(`✗ ${dep.name} missing dependencies`, 'error');
        }
      });
    }

    function checkGlobalVariables() {
      log('Checking global variables...', 'info');

      const requiredGlobals = [
        'SUPABASE_CONFIG',
        'APP_PIN',
        'generateId',
        'getSupabase',
        'initializeUI',
        'unlockSite',
        'performOCR',
        'initializeApp'
      ];

      const results = document.getElementById('globalsCheck');
      results.innerHTML = '';

      requiredGlobals.forEach(global => {
        const exists = typeof window[global] !== 'undefined';
        const item = document.createElement('div');
        item.className = `test-item ${exists ? 'pass' : 'fail'}`;
        item.textContent = `${exists ? '✓' : '✗'} ${global}`;
        results.appendChild(item);

        if (exists) {
          log(`✓ ${global} is available`, 'success');
        } else {
          log(`✗ ${global} is missing`, 'error');
        }
      });
    }

    async function checkSupabaseConnection() {
      log('Checking Supabase setup...', 'info');

      try {
        if (typeof window.supabase === 'undefined') {
          log('⚠ Supabase library not loaded yet', 'warning');
          return;
        }

        const client = getSupabase();
        if (!client) {
          log('✗ Could not initialize Supabase client', 'error');
          return;
        }

        log('✓ Supabase client initialized', 'success');

        // Try to test connection
        const { error } = await client.from('recipes').select('count', { count: 'exact' });
        if (error) {
          log(`⚠ Database query error: ${error.message}`, 'warning');
        } else {
          log('✓ Database connection successful', 'success');
        }
      } catch (err) {
        log(`✗ Error testing Supabase: ${err.message}`, 'error');
      }
    }

    function checkHtmlStructure() {
      log('Checking HTML structure...', 'info');

      const requiredElements = [
        { id: 'pinScreen', name: 'PIN Screen' },
        { id: 'homeView', name: 'Home View' },
        { id: 'mainBrowser', name: 'Main Category Browser' },
        { id: 'ethnicityBrowser', name: 'Ethnicity Browser' },
        { id: 'recipeResults', name: 'Recipe Results' },
        { id: 'formPanel', name: 'Recipe Form' },
        { id: 'ocrUploadPanel', name: 'OCR Upload Panel' },
        { id: 'reviewQueuePanel', name: 'Review Queue Panel' },
        { id: 'reviewComparisonPanel', name: 'Review Comparison Panel' }
      ];

      const results = document.getElementById('htmlCheck');
      results.innerHTML = '';

      requiredElements.forEach(elem => {
        const found = document.getElementById(elem.id) !== null;
        const item = document.createElement('div');
        item.className = `test-item ${found ? 'pass' : 'fail'}`;
        item.textContent = `${found ? '✓' : '✗'} ${elem.name}`;
        results.appendChild(item);

        if (found) {
          log(`✓ HTML element found: #${elem.id}`, 'success');
        } else {
          log(`✗ HTML element missing: #${elem.id}`, 'error');
        }
      });
    }

    async function loadApp() {
      log('Loading application...', 'info');
      try {
        // Check all dependencies loaded
        checkModuleDependencies();
        log('✓ All modules ready', 'success');
      } catch (err) {
        log(`✗ Error: ${err.message}`, 'error');
      }
      updateConsoleOutput();
    }

    function openApp() {
      window.open('index.html', 'app', 'width=1200,height=800');
    }

    // Auto-run basic checks on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        checkModuleDependencies();
        log('✓ Page loaded', 'success');
        updateConsoleOutput();
      }, 500);
    });
  </script>
</body>
</html>
