name: Supabase Heartbeat

on:
  schedule:
    # Mondays and Thursdays at 3:17 PM UTC (10:17 AM Central during daylight time)
    - cron: "17 15 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-supabase-active:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Cheryl's recipes table
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "apikey: sb_publishable_dW3jNFrs9G4zmkdeL968NA_yGRv8A6a" \
            --header "Authorization: Bearer sb_publishable_dW3jNFrs9G4zmkdeL968NA_yGRv8A6a" \
            "https://knpovxbqoohsddquiyjv.supabase.co/rest/v1/recipes?select=id&limit=1")"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Supabase heartbeat failed with HTTP $status"
            cat "$response_file"
            exit 1
          fi

          echo "Supabase heartbeat succeeded with HTTP $status"
